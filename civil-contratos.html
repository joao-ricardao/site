<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Termos de Direito Civil - Contratos</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 550px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #1a252f;
            font-size: 1.6rem;
        }
        p.subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        #question {
            font-weight: 600;
            font-size: 1.1rem;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        #result-container {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            text-align: left;
        }
        #result-container.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #result-container.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #result-text {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 100%;
        }
        .correct .timer-bar { background-color: #28a745; }
        .incorrect .timer-bar { background-color: #dc3545; }

        @keyframes shrinkTimer {
            from { width: 100%; }
            to { width: 0%; }
        }

        #score {
            font-size: 0.9rem;
            color: #495057;
            font-weight: bold;
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
        }
        #gameOver {
            display: none;
        }
        #gameOver h2 {
            color: #2d3748;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Termos sobre Direito Civil - Contratos</h1>
        
        <div id="gameContent">
            <p class="subtitle">Digite o termo referente à definição apresentada:</p>
            
            <div id="question"></div>

            <div class="input-group">
                <input type="text" id="answer" placeholder="Digite sua resposta aqui" onkeypress="handleKeyPress(event)">
                <button id="btnVerify" onclick="checkAnswer()">Verificar</button>
            </div>

            <div id="result-container">
                <div id="result-text"></div>
                <div id="timerBar" class="timer-bar"></div>
            </div>

            <div id="score">Acertos: 0 | Erros: 0 | Questão: 1/15</div>
        </div>

        <div id="gameOver">
            <h2>Fim do Jogo!</h2>
            <p id="finalScore"></p>
            <button onclick="restartGame()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const terms = {
            "Findo o contrato de comodato, no caso do uso de um imóvel, o comodatário deve _____ _____.": "pagar aluguel",
            "Em contrato celebrado de comodato, o comodatário é obrigado a c_____ a coisa emprestada e, uma vez constituído em mora, a _____ _____.": "conservar, pagar aluguel",
            "Mútuo feito a menor sem autorização _____ _____ ser reavido do menor nem de seus fiadores, exceção quando o menor teve b_____ com o empréstimo.": "não pode, benefício", /* <--- VÍRGULA ADICIONADA AQUI */
            "A doação pode ser revogada por i_____ do donatário, ou por i_____ do encargo.": "ingratidão, inexecução",
            "O comodatário não responde por deterioração decorrente de _____ _____ , com a exceção de quando ele prefere salvar seus próprios bens em detrimento dos bens do _____.": "caso fortuito, comodante",
            "No comodato, indique: a finalidade (uso/guarda), o pagamento (gratuito/oneroso), a coisa (fungível/não fungível) e a devolução (própria coisa/equivalente).": "uso, gratuito, não fungível, própria coisa",
            "No mútuo, indique: a finalidade (uso/guarda), o pagamento (gratuito/oneroso), a coisa (fungível/não fungível) e a devolução (própria coisa/equivalente).": "uso, gratuito/oneroso, fungível, equivalente",
            "No depósito, indique: a finalidade (uso/guarda), o pagamento (gratuito/oneroso), a coisa (fungível/não fungível/móvel) e a devolução (própria coisa/equivalente).": "guarda, gratuito/oneroso, móvel, própria coisa",
            "Na locação, indique: a finalidade (uso/guarda), o pagamento (gratuito/oneroso), a coisa (fungível/não fungível/móvel) e a devolução (própria coisa/equivalente).": "uso, oneroso, não fungível, própria coisa",
            "Exemplo de contrato em que, por exemplo, João empresta gratuitamente seu carro para Pedro usar durante uma semana. Ao final, Pedro deve devolver o mesmo carro a João.": "comodato",
            "Exemplo de contrato em que, por exemplo, João empresta R$ 1.000 para Pedro. Pedro pode gastar o dinheiro como quiser e, depois, deve devolver R$ 1.000 (ou o valor devido, se houver juros).":"mútuo",  
            "Exemplo de contrato em que, por exemplo, João vai viajar e deixa seu carro na garagem de Pedro para que Pedro o guarde durante 15 dias. Ao retornar, João pede o carro de volta, e Pedro deve entregar o mesmo carro.":"depósito",  
            "Exemplo de contrato em que, por exemplo, João permite que Pedro utilize seu apartamento durante 12 meses, mediante o pagamento mensal de R$ 1.500, devendo Pedro restituir o imóvel ao final do período.":"locação",  
            "Exemplo de contrato em que, por exemplo, Durante 12 meses, Pedro poderá utilizar determinado apartamento pertencente a João, mediante pagamento mensal de R$ 1.500, comprometendo-se a restituí-lo ao término do período.":"locação",  
            "Exemplo de contrato em que, por exemplo, Pedro recebe de João R$ 10.000 e poderá utilizar livremente o valor recebido, devendo, após determinado prazo, restituir quantia do mesmo gênero, qualidade e quantidade, conforme as condições estabelecidas entre as partes.":"mútuo",  
            "Exemplo de contrato em que, por exemplo, Uma empresa recebe de outra 500 litros de determinado produto para utilizar em sua produção, comprometendo-se a restituir, após 30 dias, outros 500 litros do mesmo produto, com a mesma qualidade.":"mútuo",  
            "Exemplo de contrato em que, por exemplo, durante uma viagem de 15 dias, João entrega seu relógio de alto valor a Pedro, que se compromete a mantê-lo sob sua responsabilidade e a devolvê-lo a João quando ele retornar.":"depósito",  
            "Exemplo de contrato em que, por exemplo, João permite que Pedro utilize gratuitamente sua casa de praia durante as férias, comprometendo-se Pedro a restituir o imóvel ao término do período.":"comodato",  
            "Exemplo de contrato em que, por exemplo, Maria permite que sua irmã utilize gratuitamente seu carro durante uma semana, comprometendo-se a irmã a devolvê-lo ao término desse período, nas mesmas condições em que o recebeu.":"comodato",  
            "Pelo contrato de depósito, recebe o depositário um objeto móvel, para _____, até que o depositante o _____.": "guardar, reclame",
            "Tipo de empréstimo gratuito de coisa não fungível.": "comodato",
            "Tipo de empréstimo de coisa fungível.": "mútuo",
            "Empréstimo gratuito de coisas não fungíveis, aperfeiçoado com a tradição.": "comodato",
            "Empréstimo de coisas fungíveis, com restituição de coisa do mesmo gênero, qualidade e quantidade.": "mútuo",
            "Não pode ser convencionado por mais de 4 anos e termina com a morte de qualquer das partes.": "prestação de serviço",
            "Não se extingue pela morte das partes quando não contratado em consideração às qualidades pessoais do contratado.": "empreitada",
            "João contrata Pedro para construir um muro por R$ 10.000.": "empreitada",
            "João contrata Pedro para trabalhar como pedreiro durante 3 meses, recebendo R$ 3.000 por mês.": "prestação de serviço",
            "O contratado é obrigado a ter na guarda e conservação do objeto do contrato o cuidado e a diligência que costuma ter com o que lhe pertence, bem como a devolvê-lo, com todos os frutos e acrescidos, quando o exija o contratante.": "depósito",
            "Você não cumpriu sua obrigação? Então não pode exigir que eu cumpra a minha.": "exceção do contrato não cumprido",
            "_____ _____ é a multa previamente combinada pelo descumprimento.": "cláusula penal",
            "O depósito _____ não se presume gratuito.": "necessário",
            "O depósito _____ se presume gratuito.": "voluntário",
            "O contrato de depósito é ______, exceto se houver convenção em sentido contrário.": "gratuito",   
            "Em relação as garantias, a existência de fiança no contrato de locação não impede o locador de exercer o _____ legal, em caso de inadimplemento, uma vez que a _____ é uma garantia c_____ e o penhor é uma garantia _____": "penhor, fiança, contratual, legal",
            "A Lei do Inquilinato veda apenas a cumulação de garantias _____": "contratuais",
            "Tipos de garantias contratuais: f_____, s-f, c_____": "fiança, seguro-fiança, caução",
            "Rescindida ou finda a locação, qualquer que seja sua causa, resolvem-se as _____, assegurado o direito de indenização do sublocatário contra o sublocador.": "sublocações",
            "A solidariedade não se _____; ela resulta da _____ ou da _____ _____. ": "presume, lei, vontade das partes",
            "Na pluralidade de devedores em obrigação divisível (o pagamento em dinheiro do aluguel), a dívida se divide em partes iguais, respondendo cada uma apenas pela sua ___-___. ": "quota-parte",
            "1+1":"2" /* <--- VÍRGULA ADICIONADA AQUI TAMBÉM */
        };

        const TOTAL_QUESTIONS = 15;
        let currentTerm;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let questionCount = 0;
        let usedTerms = [];
        let timerTimeout;

        function newQuestion() {
            if (questionCount >= TOTAL_QUESTIONS) {
                endGame();
                return;
            }

            const availableTerms = Object.keys(terms).filter(term => !usedTerms.includes(term));
            
            if (availableTerms.length === 0) {
                endGame();
                return;
            }

            currentTerm = availableTerms[Math.floor(Math.random() * availableTerms.length)];
            usedTerms.push(currentTerm);
            
            document.getElementById('question').textContent = currentTerm;
            document.getElementById('answer').value = '';
            document.getElementById('answer').disabled = false;
            document.getElementById('btnVerify').disabled = false;
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('answer').focus();
            
            questionCount++;
            updateScore();
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
            const correctAnswer = terms[currentTerm].toLowerCase();

            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const timerBar = document.getElementById('timerBar');

            document.getElementById('answer').disabled = true;
            document.getElementById('btnVerify').disabled = true;

            let displayTime;

            if (userAnswer === correctAnswer) {
                resultText.textContent = 'Correto! Parabéns!';
                resultContainer.className = 'correct';
                correctAnswers++;
                displayTime = 5000;
            } else {
                resultText.textContent = `Incorreto. A resposta correta é: ${terms[currentTerm]}`;
                resultContainer.className = 'incorrect';
                wrongAnswers++;
                displayTime = 10000;
            }

            resultContainer.style.display = 'block';

            timerBar.style.animation = 'none';
            timerBar.offsetHeight; 
            timerBar.style.animation = `shrinkTimer ${displayTime}ms linear forwards`;

            updateScore();

            clearTimeout(timerTimeout);
            timerTimeout = setTimeout(newQuestion, displayTime);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !document.getElementById('btnVerify').disabled) {
                checkAnswer();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Acertos: ${correctAnswers} | Erros: ${wrongAnswers} | Questão: ${questionCount}/${TOTAL_QUESTIONS}`;
        }

        function endGame() {
            document.getElementById('gameContent').style.display = 'none';
            document.getElementById('gameOver').style.display = 'block';
            
            const percentage = ((correctAnswers / TOTAL_QUESTIONS) * 100).toFixed(1);

            document.getElementById('finalScore').innerHTML = `
                <strong>Resumo do Desempenho:</strong><br><br>
                Acertos: <span style="color: green;">${correctAnswers}/${TOTAL_QUESTIONS}</span><br>
                Erros: <span style="color: red;">${wrongAnswers}</span><br>
                Aproveitamento: <strong>${percentage}%</strong>
            `;
        }

        function restartGame() {
            correctAnswers = 0;
            wrongAnswers = 0;
            questionCount = 0;
            usedTerms = [];
            
            document.getElementById('gameContent').style.display = 'block';
            document.getElementById('gameOver').style.display = 'none';
            
            newQuestion();
        }

        newQuestion();
    </script>
</body>
</html>
