
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Termos para Estudo</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 550px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #1a252f;
            font-size: 1.6rem;
        }
        p.subtitle {
            color: #6c757d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        #question {
            font-weight: 600;
            font-size: 1.1rem;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        #result-container {
            display: none;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            text-align: left;
        }
        #result-container.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #result-container.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #result-text {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 100%;
        }
        .correct .timer-bar { background-color: #28a745; }
        .incorrect .timer-bar { background-color: #dc3545; }

        @keyframes shrinkTimer {
            from { width: 100%; }
            to { width: 0%; }
        }

        #score {
            font-size: 0.9rem;
            color: #495057;
            font-weight: bold;
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
        }
        #gameOver {
            display: none;
        }
        #gameOver h2 {
            color: #2d3748;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Termos para Estudo</h1>
        
        <div id="gameContent">
            <p class="subtitle">Digite o termo referente à definição apresentada:</p>
            
            <div id="question"></div>

            <div class="input-group">
                <input type="text" id="answer" placeholder="Digite sua resposta aqui" onkeypress="handleKeyPress(event)">
                <button id="btnVerify" onclick="checkAnswer()">Verificar</button>
            </div>

            <div id="result-container">
                <div id="result-text"></div>
                <div id="timerBar" class="timer-bar"></div>
            </div>

            <div id="score">Acertos: 0 | Erros: 0 | Questão: 1/15</div>
        </div>

        <div id="gameOver">
            <h2>Fim do Jogo!</h2>
            <p id="finalScore"></p>
            <button onclick="restartGame()">Jogar Novamente</button>
        </div>
    </div>

    <script>
        const terms = {
"Agente autônomo de IA da Meta.": "Muse",
"Agente autônomo de IA do Google.": "Gemini Spark",
"Agente autônomo de IA da OpenAI.": "ChatGPT Work",
"Agente autônomo de IA da Anthropic.": "Claude Cowork",
"Três principais índices de mercado americano": "Dow Jones, Nasdaq, S&P 500",
"Duas principais bolsas de valores dos Estados Unidos": "NYSE, Nasdaq",
"Ações que tem prioridade no recebimento de dividendos e outros lucros distribuídos pela companhia": "preferenciais",
"Ações que conferem direito de voto nas assembleias da empresa e participação nas decisões estratégicas": "ordinárias",
"Ações que terminam com o número 3 no código (ticker)": "ordinárias",
"Termo que corresponde a produtos básicos não industrializados, matérias-primas que não se diferem independentemente de quem as produziu ou de sua origem, sendo seu preço uniformemente determinado pela oferta e procura internacional.": "commodities",
"São substâncias ou produtos primários, minerais ou agrícolas, normalmente insumos para a produção de bens acabados.": "commodities",
"Processo de fabricação industrial usado para desenhar circuitos microscópicos numa base de silício (wafer)": "litografia",
"Dispositivo de hardware para treinamento de IA (Deep Learning), renderização 3D, mineração.": "GPU",
"Dispositivo de hardware para rodar o sistema operacional, compilar códigos, lógica de jogos..": "CPU",
"Autarquia federal vinculada ao Ministério da Fazenda que tem como missão regular, normatizar, disciplinar e fiscalizar o mercado de capitais no Brasil": "CVM",
"No mercado financeiro, o que é a sigla BVMF": "Bolsa de Valores, Mercadorias e Futuro",
"Atualmente no mercado financeiro, a VALE3 - Vale S.A. (VALE3) é negociada na B3 pelo valor aproximado na casa de ____": "60 BRL",
"Atualmente no mercado financeiro, o Banco do Brasil SA (BBAS3) é negociada na B3 pelo valor aproximado na casa de ____": "20 BRL",
"Aeronave de dois corredores": "wide-body",
"Aeronave de corredor único": "narrow-body",
"Aeronave da Boeing destinada ao transporte de passageiros e cargas em rotas de curta e média distância": "737",
"O que é FAA? (em inglês)": "Federal Aviation Administration",
"O que é CLEEN Program? (em inglês)": "Continuous Lower Energy, Emissions and Noise Program",
"O Combustível Sustentável de Aviação (SAF, da sigla em inglês _____ _____ _____) é um combustível alternativo ao _____ __ _____, desenvolvido para reduzir de forma expressiva as emissões de _____ __ _____ _____ no transporte aéreo.": "Sustainable Aviation Fuel, querosene de aviação, gases de efeito estufa",
"Pessoa que é forçada a deixar seu país de origem devido a conflitos armados, violência generalizada, graves violações dos direitos humanos ou fundados temores de perseguição por motivos de raça, religião, nacionalidade, grupo social, orientação sexual, identidade de gênero ou opinião política.": "refugiado",
"Padrão criado pela Organização Mundial da Saúde (OMS) para categorizar diagnósticos, sintomas, lesões e outros fatores de saúde com códigos alfanuméricos": "Classificação Internacional de Doenças",
"Políticas focais que alocam recursos em benefício de pessoas pertencentes a grupos discriminados e vitimados pela exclusão sócio-econômica no passado ou no presente": "ações afirmativas",

        };

        const TOTAL_QUESTIONS = 15;
        let currentTerm;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let questionCount = 0;
        let usedTerms = [];
        let timerTimeout;

        function newQuestion() {
            if (questionCount >= TOTAL_QUESTIONS) {
                endGame();
                return;
            }

            const availableTerms = Object.keys(terms).filter(term => !usedTerms.includes(term));
            
            if (availableTerms.length === 0) {
                endGame();
                return;
            }

            currentTerm = availableTerms[Math.floor(Math.random() * availableTerms.length)];
            usedTerms.push(currentTerm);
            
            document.getElementById('question').textContent = currentTerm;
            document.getElementById('answer').value = '';
            document.getElementById('answer').disabled = false;
            document.getElementById('btnVerify').disabled = false;
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('answer').focus();
            
            questionCount++;
            updateScore();
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
            const correctAnswer = terms[currentTerm].toLowerCase();

            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const timerBar = document.getElementById('timerBar');

            document.getElementById('answer').disabled = true;
            document.getElementById('btnVerify').disabled = true;

            let displayTime;

            if (userAnswer === correctAnswer) {
                resultText.textContent = 'Correto! Parabéns!';
                resultContainer.className = 'correct';
                correctAnswers++;
                displayTime = 5000;
            } else {
                resultText.textContent = `Incorreto. A resposta correta é: ${terms[currentTerm]}`;
                resultContainer.className = 'incorrect';
                wrongAnswers++;
                displayTime = 10000;
            }

            resultContainer.style.display = 'block';

            timerBar.style.animation = 'none';
            timerBar.offsetHeight; 
            timerBar.style.animation = `shrinkTimer ${displayTime}ms linear forwards`;

            updateScore();

            clearTimeout(timerTimeout);
            timerTimeout = setTimeout(newQuestion, displayTime);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !document.getElementById('btnVerify').disabled) {
                checkAnswer();
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Acertos: ${correctAnswers} | Erros: ${wrongAnswers} | Questão: ${questionCount}/${TOTAL_QUESTIONS}`;
        }

        function endGame() {
            document.getElementById('gameContent').style.display = 'none';
            document.getElementById('gameOver').style.display = 'block';
            
            const percentage = ((correctAnswers / TOTAL_QUESTIONS) * 100).toFixed(1);

            document.getElementById('finalScore').innerHTML = `
                <strong>Resumo do Desempenho:</strong><br><br>
                Acertos: <span style="color: green;">${correctAnswers}/${TOTAL_QUESTIONS}</span><br>
                Erros: <span style="color: red;">${wrongAnswers}</span><br>
                Aproveitamento: <strong>${percentage}%</strong>
            `;
        }

        function restartGame() {
            correctAnswers = 0;
            wrongAnswers = 0;
            questionCount = 0;
            usedTerms = [];
            
            document.getElementById('gameContent').style.display = 'block';
            document.getElementById('gameOver').style.display = 'none';
            
            newQuestion();
        }

        newQuestion();
    </script>
</body>
</html>
